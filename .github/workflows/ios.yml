name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS tests
    # Must be an Apple Silicon runner: the iOS app under test is an arm64 build
    # and the RN artifact is x86_64-only, which cannot run on arm64 simulators.
    runs-on: macos-14
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download app under test
        run: npm run apps:download -- ios

      - name: Run iOS tests
        run: bash scripts/run-ios-tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: logs/
          if-no-files-found: ignore

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results/ios --clean -o allure-report/ios

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-allure-report
          path: allure-report/ios/
          if-no-files-found: ignore

  publish:
    name: Publish iOS report
    needs: ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: ios-allure-report
          path: site/ios
      - name: Add index page
        run: cp pages/index.html site/index.html
      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
