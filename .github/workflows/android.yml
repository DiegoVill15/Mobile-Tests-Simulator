name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download app under test
        run: bash scripts/download-apps.sh

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash -euo pipefail <<'BASH'
            mkdir -p logs

            ANDROID_UDID="$(adb devices | awk '$2 == "device" { print $1; exit }')"
            if [ -z "${ANDROID_UDID}" ]; then
              echo "No online Android emulator found"
              adb devices
              exit 1
            fi

            export ANDROID_UDID
            export ANDROID_SERIAL="${ANDROID_UDID}"
            echo "Running against emulator: ${ANDROID_UDID}"

            npx wdio run config/wdio.android.conf.ts --waitforTimeout 20000 2>&1 \
              | tee logs/android-tests.log
            BASH

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs
          path: logs/
          if-no-files-found: ignore
